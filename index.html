<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер сфер жизни</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <header class="hero-header">
    <div class="hero-blob" aria-hidden="true"></div>
    <div class="hero-top">
      <div class="brand">
        <span class="brand-emoji" aria-hidden="true">🎯</span>
        <div>
          <h1>С возвращением!</h1>
          <p class="subtitle">Модуль «Работа»: проекты, таймлайн, букинг людей</p>
        </div>
      </div>
      <div class="hero-actions">
        <button id="themeToggle" class="icon-btn" type="button" title="Переключить тему" aria-label="Переключить тему">
          <span id="themeIcon">🌙</span>
        </button>
        <div class="avatar" aria-hidden="true">👩‍💻</div>
      </div>
    </div>

    <nav class="sphere-nav" aria-label="Сферы жизни">
      <button class="sphere-tab active" type="button" data-sphere="work">
        <span class="tab-icon">💼</span><span class="tab-label">Работа</span>
      </button>
      <button class="sphere-tab disabled" type="button" disabled title="Скоро">
        <span class="tab-icon">❤️</span><span class="tab-label">Здоровье</span>
      </button>
      <button class="sphere-tab disabled" type="button" disabled title="Скоро">
        <span class="tab-icon">💰</span><span class="tab-label">Финансы</span>
      </button>
      <button class="sphere-tab disabled" type="button" disabled title="Скоро">
        <span class="tab-icon">🌱</span><span class="tab-label">Личное</span>
      </button>
    </nav>
  </header>

  <main>

    <section class="card">
      <div class="card-head">
        <h2>Таймлайн проектов</h2>
        <button id="addProject" class="btn btn-primary" type="button">+ Проект</button>
      </div>

      <div class="filter-row" id="peopleFilterRow">
        <span class="filter-label">Букинг:</span>
        <div id="peopleChips" class="chips"></div>
        <button id="managePeople" class="btn btn-ghost btn-small" type="button">👤 Люди</button>
      </div>

      <div id="ganttChart" class="gantt-chart">
        <div id="ganttTooltip" class="tooltip" hidden></div>
      </div>
      <p id="ganttEmpty" class="empty-note" hidden>Добавь проект, чтобы увидеть таймлайн.</p>
    </section>

    <section class="card" id="peoplePanel" hidden>
      <div class="card-head">
        <h2>Люди</h2>
        <button id="closePeople" class="btn btn-ghost btn-small" type="button">Закрыть</button>
      </div>
      <div class="add-form">
        <input id="newPersonName" class="name-input" type="text" placeholder="Имя человека" aria-label="Имя человека">
        <button id="addPersonBtn" class="btn btn-primary" type="button">Добавить</button>
      </div>
      <ul id="peopleList" class="people-list"></ul>
    </section>

    <section class="card" id="projectFormCard" hidden>
      <div class="card-head">
        <h2 id="projectFormTitle">Новый проект</h2>
        <button id="closeProjectForm" class="btn btn-ghost btn-small" type="button">Отмена</button>
      </div>
      <div class="project-form">
        <label class="field">
          <span>Название</span>
          <input id="pfName" type="text" placeholder="Например, Редизайн сайта">
        </label>
        <div class="field-row">
          <label class="field">
            <span>Начало</span>
            <input id="pfStart" type="date">
          </label>
          <label class="field">
            <span>Конец</span>
            <input id="pfEnd" type="date">
          </label>
        </div>
        <label class="field">
          <span>Статус</span>
          <select id="pfStatus">
            <option value="planned">Запланирован</option>
            <option value="active">В работе</option>
            <option value="paused">На паузе</option>
            <option value="done">Завершён</option>
          </select>
        </label>
        <div class="field">
          <span>Люди на проекте</span>
          <div id="pfPeople" class="chips chips-select"></div>
        </div>
        <label class="field">
          <span>Заметки</span>
          <textarea id="pfNotes" rows="2" placeholder="Например, форматы видео, ссылки, детали ТЗ"></textarea>
        </label>
        <div class="form-actions">
          <button id="deleteProjectBtn" class="btn btn-danger-ghost" type="button" hidden>Удалить проект</button>
          <button id="saveProjectBtn" class="btn btn-primary" type="button">Сохранить</button>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <button id="resetAll" class="btn btn-danger-ghost" type="button">Сбросить все данные</button>
    <span class="footer-note">Данные хранятся только в этом браузере (localStorage)</span>
  </footer>

</div>
<script src="script.js"></script>
</body>
</html>
